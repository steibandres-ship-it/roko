<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fans · World Music</title><link rel="stylesheet" href="/static/dashboard.css"><style>
main{max-width:1100px;margin:auto;padding:40px 24px}h1{font-size:44px}form{display:grid;gap:14px;padding:24px}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #45454b;background:#19191f;color:#fff}label{display:grid;gap:6px}button{cursor:pointer;background:#413168}textarea{min-height:180px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.item{padding:20px;border-bottom:1px solid #393940;overflow-wrap:anywhere}.item button{margin:8px 8px 0 0}#notice{padding:18px;color:#dacaef;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}.check{display:flex;align-items:center}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="/dashboard">← Volver al panel</a><p>WORLD MUSIC / FAN CONNECT</p><h1>Tu música. Tus fans.</h1><p>Contactos con suscripción registrada y campañas directas desde tu espacio local.</p><label>Artista<select id="artist"></select></label><p id="notice" role="status" aria-live="polite"></p><div class="grid"><section class="panel"><h2>Registrar suscriptor</h2><form id="contact"><label>Nombre<input name="name" maxlength="120"></label><label>Correo<input name="email" type="email" required></label><label>Pista o fuente de origen<input name="source" required maxlength="240" placeholder="Pre-save · Nombre de la pista"></label><label class="check"><input name="consent" type="checkbox" required> Tengo registrada la aceptación explícita del fan para recibir novedades.</label><button>Guardar contacto</button></form></section><section class="panel"><h2>Crear campaña</h2><form id="campaign"><label>Tipo de mensaje<select id="template"><option value="">Personalizado</option><option>Nuevo lanzamiento</option><option>Merchandising</option><option>Próximo lanzamiento</option></select></label><label>Asunto<input name="subject" required maxlength="200"></label><label>Mensaje<textarea name="body" required maxlength="20000"></textarea></label><label>Filtrar por origen exacto<input name="source" maxlength="240" placeholder="Vacío: todos los suscriptores activos"></label><button>Guardar borrador</button></form></section></div><section class="panel"><h2 id="audience-title">Audiencia</h2><div id="contacts"></div></section><section class="panel"><h2>Campañas</h2><p>Los envíos se procesan en lotes de hasta 20. Aceptado por SMTP no equivale a entregado.</p><div id="campaigns"></div></section></main><script src="/static/fans.js" defer></script></body></html>
